[tool.poetry]
name = "Chota baackend"
version = "0.1.0"
description = "Chota Backend"
package-mode = false
authors = ["Precious Udoibok <preciousudoibok@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
fastapi = "^0.100.0"
python-multipart = "^0.0.6"
email-validator = "^2.0.0.post2"
requests = "^2.31.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
tenacity = "^8.2.0"
gunicorn = "^20.0.4"
jinja2 = "^3.1.0"
psycopg2-binary = "^2.9.0"
alembic = "^1.11.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pydantic = ">=2.10.1,<3.0.0"
uvicorn = "^0.23.1"
poetry-dotenv-plugin="0.2.0"
httpx = "^0.24.1"
asyncio = "^3.4.3"
sqlmodel = "^0.0.22"


[tool.poetry.group.dev.dependencies]
mypy = "^1.4"
black = "^23.3"
isort = "^5.12.0"
autoflake = "^1.3.1"
flake8 = "^3.7.9"
ruff = "^0.5.3"
tenacity = "^8.2.0"
pytest-asyncio = "0.19.0"
pre-commit = "2.20"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
sqlalchemy-stubs = "^0.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.6.1"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88

[build-system]
requires = ["poetry>=1.2"]
build-backend = "poetry.masonry.api"

[tool.ruff]
extend-exclude = ["__pycache__",".pytest_cache"]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402","F401","E501"]